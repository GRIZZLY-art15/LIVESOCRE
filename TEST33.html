<!DOCTYPE html>
<html lang="en" data-bs-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BIGSPORT | World Cup 2026 Live Score</title>

<!-- Bootstrap -->
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.6/dist/css/bootstrap.min.css" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.6/dist/js/bootstrap.bundle.min.js"></script>

<!-- API-Sports Widgets (WAJIB MODULE) -->
<script type="module" src="https://widgets.api-sports.io/3.1.0/widgets.js"></script>

<style>
body{
  background:radial-gradient(circle at top,#0c1a2a,#060b13);
  font-family:'Segoe UI',sans-serif;
  color:#e6ebf2;
}
.navbar{
  background:linear-gradient(90deg,#0b1625,#0f243f);
  border-bottom:1px solid rgba(255,138,0,.4);
}
.navbar-brand{
  font-weight:700;
  letter-spacing:.5px;
}
.nav-link{
  color:#cfd6e1;
}
.nav-link.active,.nav-link:hover{
  color:#ff8a00;
}
.card{
  background:linear-gradient(180deg,#0f1f33,#0a1422);
  border:1px solid rgba(255,255,255,.08);
  border-radius:16px;
}
.btn-live{
  background:linear-gradient(90deg,#ff8a00,#ffb347);
  border:none;
  color:#000;
  font-weight:600;
}
.btn-live:hover{
  opacity:.9;
}
.section-title{
  font-weight:700;
  color:#ffb347;
}
</style>
</head>

<body>

<!-- ================= CONFIG (HARUS PALING ATAS) ================= -->
<api-sports-widget
  data-type="config"
  data-key="bc1dec53597a452699badf074f2e6c81"
  data-sport="football"
  data-theme="dark"
  data-lang="en"
  data-refresh="60"
  data-show-logos="true"
  data-target-game="#game-detail"
  data-target-standings="#standings"
></api-sports-widget>

<!-- ================= NAVBAR ================= -->
<nav class="navbar navbar-expand-lg sticky-top">
  <div class="container-fluid">
    <a class="navbar-brand text-warning" href="#">
      ⚽ BIGSPORT
    </a>

    <ul class="navbar-nav ms-3">
      <li class="nav-item">
        <a class="nav-link active" href="#">World Cup 2026</a>
      </li>
    </ul>

    <a href="#" class="btn btn-live ms-auto">
      ▶ Watch Live
    </a>
  </div>
</nav>

<!-- ================= CONTENT ================= -->
<div class="container-fluid p-3">
  <div class="row g-3">

    <!-- LEAGUES -->
    <div class="col-lg-3">
      <div class="card p-3">
        <h6 class="section-title mb-2">Competitions</h6>
        <api-sports-widget data-type="leagues"></api-sports-widget>
      </div>
    </div>

    <!-- LIVE GAMES -->
    <div class="col-lg-6">
      <div class="card p-3">
        <div class="d-flex justify-content-between align-items-center mb-2">
          <h6 class="section-title m-0">Live Matches</h6>
          <span class="badge bg-success">LIVE</span>
        </div>
        <api-sports-widget data-type="games"></api-sports-widget>
      </div>
    </div>

    <!-- DETAIL -->
    <div class="col-lg-3">

      <div class="card p-3 mb-3" id="standings">
        <h6 class="section-title">Standings</h6>
      </div>

      <div class="card p-3" id="game-detail">
        <h6 class="section-title">Match Detail</h6>
        <api-sports-widget data-type="game"></api-sports-widget>
      </div>

    </div>
  </div>
</div>

<!-- ================= FOOTER ================= -->
<footer class="text-center text-secondary small py-3">
  © 2026 BIGSPORT — World Cup Live Score
</footer>

</body>
</html>
